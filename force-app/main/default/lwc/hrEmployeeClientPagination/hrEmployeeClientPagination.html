<template>

    <lightning-card>

        <!-- ===================== HEADER ===================== -->

        <div class="employee-header">

            <div>

                <h1>
                    👨‍💼 Employee Directory
                </h1>

                <p>
                    Manage employee records, search employees, filter by department
                    and perform CRUD operations from one place.
                </p>

            </div>

            <div>

                <lightning-button
                    label="Add Employee"
                    variant="brand"
                    icon-name="utility:add"
                    onclick={handleForm}>
                </lightning-button>

            </div>

        </div>


        <!-- ===================== FILTER CARD ===================== -->

        <div class="filter-card">

            <div class="section-title">

                Employee Filters

            </div>

            <div class="section-subtitle">

                Filter employees using department or global search.

            </div>

            <div class="filter-grid">

                <lightning-combobox

                    label="Department"

                    value={selectedDept}

                    options={departmentOptions}

                    onchange={handleDepartmentChange}>

                </lightning-combobox>


                <lightning-input

                    type="search"

                    label="Search Employee"

                    placeholder="Search by Name, City, Email or Phone"

                    onchange={handleGlobalSearch}>

                </lightning-input>

            </div>

        </div>



        <!-- ===================== TABLE CARD ===================== -->

        <div class="table-card">

            <div class="table-header">

                <div>

                    <h2>

                        Employee Records

                    </h2>

                    <p>

                        Browse all employees and perform available actions.

                    </p>

                </div>

            </div>


            <!-- ===================== TABLE ===================== -->

            <template lwc:if={employeeRecs}>

                <lightning-datatable

                    key-field="Id"

                    data={paginatedEmployees}

                    columns={tableColumns}

                    show-row-number-column

                    onrowaction={handleRowAction}>

                </lightning-datatable>



                <!-- ===================== PAGINATION ===================== -->

                <div class="pagination-bar">


                    <lightning-button

                        label="Previous"

                        icon-name="utility:chevronleft"

                        onclick={handlePrevious}

                        disabled={disabledPrevious}>

                    </lightning-button>



                    <div class="pagination-summary">

                        <div class="summary-card">

                            <div class="summary-number">

                                {totalRecords}

                            </div>

                            <div class="summary-label">

                                Employees

                            </div>

                        </div>


                        <div class="summary-card">

                            <div class="summary-number">

                                {startRecord} - {endRecord}

                            </div>

                            <div class="summary-label">

                                Showing

                            </div>

                        </div>


                        <div class="summary-card">

                            <div class="summary-number">

                                {currentPage}/{totalPages}

                            </div>

                            <div class="summary-label">

                                Pages

                            </div>

                        </div>

                    </div>



                    <lightning-button

                        label="Next"

                        icon-name="utility:chevronright"

                        icon-position="right"

                        onclick={handleNext}

                        disabled={disabledNext}>

                    </lightning-button>

                </div>

            </template>



            <!-- ===================== ERROR ===================== -->

            <template lwc:elseif={employeeRecs.error}>

                <div class="error-state">

                    <lightning-icon

                        icon-name="utility:error"

                        size="small">

                    </lightning-icon>

                    <br/><br/>

                    Unable to load employee records.

                </div>

            </template>



            <!-- ===================== LOADER ===================== -->

            <template lwc:else>

                <div class="spinner-container">

                    <lightning-spinner

                        alternative-text="Loading Employees"

                        size="medium">

                    </lightning-spinner>

                </div>

            </template>

        </div>





        <!-- ===================================================== -->
        <!-- PART 2 STARTS FROM HERE (Employee Modal) -->
        <!-- Paste next response below this line -->
        <!-- ===================================================== -->
		        <!-- ===================================================== -->
        <!-- Employee Form Modal -->
        <!-- ===================================================== -->

        <template if:true={showForm}>

            <section
                role="dialog"
                tabindex="-1"
                class="slds-modal slds-fade-in-open">

                <div class="slds-modal__container">

                    <!-- Header -->

                    <header class="slds-modal__header">

                        <h2 class="slds-text-heading_medium">

                            {modalTitle}

                        </h2>

                    </header>


                    <!-- Body -->

                    <div class="slds-modal__content slds-p-around_large">

                        <div class="modal-grid">

                            <lightning-input

                                label="Employee Name"

                                name="Employee_Name__c"

                                value={employee.Employee_Name__c}

                                required

                                onchange={handleInputChange}>

                            </lightning-input>


                            <lightning-combobox

                                label="Department"

                                name="Employee_Department__c"

                                value={employee.Employee_Department__c}

                                options={departmentOptions}

                                required

                                onchange={handleInputChange}>

                            </lightning-combobox>


                            <lightning-input

                                type="tel"

                                label="Phone Number"

                                placeholder="353-362-9800"

                                name="Employee_Phone__c"

                                value={employee.Employee_Phone__c}

                                onchange={handleInputChange}>

                            </lightning-input>


                            <lightning-input

                                type="email"

                                label="Email Address"

                                placeholder="john@example.com"

                                name="Employee_Email__c"

                                value={employee.Employee_Email__c}

                                onchange={handleInputChange}>

                            </lightning-input>

                        </div>

                    </div>


                    <!-- Footer -->

                    <footer class="slds-modal__footer">

                        <lightning-button

                            label="Cancel"

                            variant="neutral"

                            onclick={handleCloseModal}>

                        </lightning-button>

                        &nbsp;

                        <lightning-button

                            label={buttonLabel}

                            variant="brand"

                            onclick={handleSaveEmployeeRecord}>

                        </lightning-button>

                    </footer>

                </div>

            </section>

            <div class="slds-backdrop slds-backdrop_open"></div>

        </template>



        <!-- ===================================================== -->
        <!-- Send Email Modal -->
        <!-- ===================================================== -->

        <template if:true={showEmailModel}>

            <section
                role="dialog"
                tabindex="-1"
                class="slds-modal slds-fade-in-open">

                <div class="slds-modal__container">

                    <!-- Header -->

                    <header class="slds-modal__header">

                        <h2 class="slds-text-heading_medium">

                            📧 Send Email

                        </h2>

                    </header>


                    <!-- Body -->

                    <div class="slds-modal__content slds-p-around_large">

                        <lightning-input

                            label="Recipient"

                            value={employee.Employee_Email__c}

                            read-only>

                        </lightning-input>


                        <lightning-input

                            class="slds-m-top_medium"

                            label="Subject"

                            value={emailSubject}

                            onchange={handleSubjectChange}>

                        </lightning-input>


                        <lightning-textarea

                            class="slds-m-top_medium"

                            label="Email Body"

                            value={emailBody}

                            onchange={handleBodyChange}>

                        </lightning-textarea>

                    </div>


                    <!-- Footer -->

                    <footer class="slds-modal__footer">

                        <lightning-button

                            label="Cancel"

                            variant="neutral"

                            onclick={handleCloseEmailModal}>

                        </lightning-button>

                        &nbsp;

                        <lightning-button

                            label="Send Email"

                            variant="brand"

                            icon-name="utility:email"

                            onclick={handleSendEmail}>

                        </lightning-button>

                    </footer>

                </div>

            </section>

            <div class="slds-backdrop slds-backdrop_open"></div>

        </template>

    </lightning-card>

</template>
